name: Build Windows EXE

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.8 32-bit
        uses: actions/setup-python@v5
        with:
          python-version: "3.8"
          architecture: x86

      - name: Check files
        run: |
          dir
          if (!(Test-Path main.py)) { throw "main.py manquant a la racine" }
          if (!(Test-Path milk_lite.spec)) { throw "milk_lite.spec manquant a la racine" }
          if (!(Test-Path src)) { throw "dossier src manquant" }

      - name: Install PyInstaller
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller==5.13.2

      - name: Build EXE
        run: python -m PyInstaller 

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: CentreCollecteLait-Win32
          path: dist/CentreCollecteLait/
