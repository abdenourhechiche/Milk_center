name: Build Windows EXE

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Python 3.7 32-bit = meilleure compat Windows 7
      - name: Setup Python 3.7 32-bit
        uses: actions/setup-python@v5
        with:
          python-version: "3.7"
          architecture: x86

      - name: Show environment
        shell: bash
        run: |
          python --version
          python -c "import struct; print('bits:', struct.calcsize('P')*8)"
          test -f main.py || (echo "main.py manquant" && exit 1)
          test -f milk_lite.spec || (echo "milk_lite.spec manquant" && exit 1)
          test -d src || (echo "src manquant" && exit 1)

      - name: Install PyInstaller (version ancienne, plus compatible Win7)
        run: |
          python -m pip install --upgrade "pip<22"
          python -m pip install "pyinstaller==4.10"

      - name: Build EXE
        run: python -m PyInstaller --noconfirm milk_lite.spec

      - name: Copy critical DLLs next to exe
        shell: bash
        run: |
          OUT="dist/CentreCollecteLait"
          DLLDIR="$(python -c "import sys,os; print(os.path.join(sys.base_prefix,'DLLs'))")"
          echo "DLLs source: $DLLDIR"
          # sqlite
          cp -f "$DLLDIR/sqlite3.dll" "$OUT/" 2>/dev/null || true
          cp -f "$DLLDIR/_sqlite3.pyd" "$OUT/" 2>/dev/null || true
          # autres pyd utiles
          cp -f "$DLLDIR"/*.dll "$OUT/" 2>/dev/null || true
          echo "=== sqlite dans le dossier final ==="
          ls -la "$OUT" | grep -i sqlite || echo "WARNING: pas de sqlite visible"
          ls -la "$OUT/CentreCollecteLait.exe"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: CentreCollecteLait-Win32
          path: dist/CentreCollecteLait/
          if-no-files-found: error
