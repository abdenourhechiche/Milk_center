name: Build Windows EXE

on:
  workflow_dispatch:        # bouton "Run workflow" manuel
  push:
    branches: [ main, master ]
    paths:
      - '**.py'
      - 'milk_lite.spec'
      - '.github/workflows/build.yml'

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python 3.8 32-bit
        uses: actions/setup-python@v5
        with:
          python-version: '3.8'
          architecture: 'x86'

      - name: Show Python info
        run: |
          python --version
          python -c "import struct; print('bits:', struct.calcsize('P')*8)"

      - name: Install PyInstaller
        run: |
          python -m pip install --upgrade pip
          python -m pip install "pyinstaller==5.13.2"

      - name: Build EXE
        run: python -m PyInstaller --noconfirm milk_lite.spec

      - name: List output
        run: |
          dir dist
          dir dist\CentreCollecteLait

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: CentreCollecteLait-Win32
          path: dist/CentreCollecteLait/
          if-no-files-found: error
